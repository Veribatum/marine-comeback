// ============================================================
// BOOT SCENE - loads all assets via Phaser preload
// ============================================================
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  preload() {
    // Load real assets by injecting directly into Phaser texture cache
    // (Phaser 3.60 does not support data URIs via this.load.image)
    Object.entries(ASSETS).forEach(([key, dataUrl]) => {
      const img = new Image();
      img.src = dataUrl;
      // Add to texture cache immediately - image is already in memory
      this.textures.addImage(key, img);
    });

    // Generate placeholder/utility textures via graphics
    const g = this.make.graphics({x:0,y:0,add:false});

    // Heart
    g.clear(); g.fillStyle(0xff2244);
    g.fillRect(2,4,4,6); g.fillRect(10,4,4,6); g.fillRect(0,6,16,6);
    g.fillRect(2,12,12,4); g.fillRect(4,16,8,4); g.fillRect(6,18,4,2);
    g.generateTexture('heart',16,20);

    // Ground tile fallback
    g.clear(); g.fillStyle(0x2a1f0e); g.fillRect(0,0,32,32);
    g.fillStyle(0x3d2e1a); g.fillRect(0,0,32,6);
    g.generateTexture('ground',32,32);

    // Platform fallback
    g.clear(); g.fillStyle(0x3d2e1a); g.fillRect(0,0,32,16);
    g.fillStyle(0x5a4428); g.fillRect(0,0,32,4);
    g.generateTexture('platform',32,16);

    // Explosion fallback
    g.clear(); g.fillStyle(0xff6600); g.fillEllipse(20,20,40,40);
    g.fillStyle(0xffff00); g.fillEllipse(20,20,20,20);
    g.generateTexture('explosion',40,40);

    // Puddle
    g.clear(); g.fillStyle(0x2244ff,0.7); g.fillEllipse(16,5,32,10);
    g.generateTexture('puddle',32,10);

    // Mysterybox fallback
    g.clear(); g.fillStyle(0xffdd00); g.fillRect(0,0,24,24);
    g.fillStyle(0xff8800); g.fillRect(0,0,24,4); g.fillRect(0,20,24,4); g.fillRect(0,0,4,24); g.fillRect(20,0,4,24);
    g.fillStyle(0xff0000); g.fillRect(10,4,4,16); g.fillRect(4,10,16,4);
    g.generateTexture('mysterybox',24,24);

    // Enemy bullet fallback
    g.clear(); g.fillStyle(0xff6600); g.fillRect(0,1,8,4);
    g.generateTexture('enemybullet',8,6);

    g.destroy();
  }
  create() { this.scene.start('StartScreen'); }
}

// ============================================================
// INTRO VIDEO SCENE
// ============================================================
class IntroVideoScene extends Phaser.Scene {
  constructor() { super('IntroVideo'); }
  create() {
    this.add.rectangle(W/2,H/2,W,H,0x000000);
    const video = document.createElement('video');
    video.src = 'Intro.mp4';
    video.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:999;';
    video.playsInline = true; video.autoplay = true; video.muted = false;
    document.body.appendChild(video);
    const cleanup = () => { if(video.parentNode) video.parentNode.removeChild(video); };
    const goStart = () => { cleanup(); this.scene.start('StartScreen'); };
    video.addEventListener('ended', goStart);
    video.addEventListener('error', goStart);
    this.time.delayedCall(30000, goStart);
    const skip = this.add.text(W-20,H-20,'[ TAP TO SKIP ]',{fontSize:'14px',fontFamily:'Courier New',color:'#888888',stroke:'#000',strokeThickness:2}).setOrigin(1,1).setScrollFactor(0).setDepth(1000).setAlpha(0);
    this.time.delayedCall(1000,()=>{ this.tweens.add({targets:skip,alpha:0.7,duration:500}); });
    this.input.once('pointerdown', goStart);
    this.input.keyboard.once('keydown', goStart);
    this.events.once('shutdown', cleanup);
  }
}

    this.add.text(W/2,H*0.28,'MARINE COMEBACK',{fontSize:'52px',fontFamily:'Impact, Arial Black',color:'#ff4400',stroke:'#ffaa00',strokeThickness:4}).setOrigin(0.5);
    this.add.text(W/2,H*0.42,'DAD BOD APOCALYPSE',{fontSize:'28px',fontFamily:'Impact, Arial Black',color:'#ffaa00',stroke:'#884400',strokeThickness:3}).setOrigin(0.5);
    const prompt = this.add.text(W/2,H*0.72,'TAP TO DEPLOY',{fontSize:'22px',fontFamily:'Courier New, monospace',color:'#44ff44',stroke:'#006600',strokeThickness:2}).setOrigin(0.5);
    this.tweens.add({targets:prompt,alpha:0,duration:600,yoyo:true,repeat:-1});
    this.add.text(W/2,H*0.92,'ARROW KEYS + Z/X  |  MOBILE: ON-SCREEN CONTROLS',{fontSize:'10px',fontFamily:'Courier New',color:'#666666'}).setOrigin(0.5);
    this.input.once('pointerdown',()=>this.scene.start('Intro'));
    this.input.keyboard.once('keydown',()=>this.scene.start('Intro'));
  }
}

// ============================================================
// BASE LEVEL SCENE
// ============================================================
class BaseLevelScene extends Phaser.Scene {
  constructor(key) { super(key); }

  initLevel(config) {
    this.levelConfig = config;
    this.levelWidth = config.width || W*4;
    this.playerFacing = 1;
    this.onGround = false;
    this.isCrouching = false;
    this.shootCooldown = 0;
    this.invincible = false;
    this.invincibleTimer = 0;
    this.levelComplete = false;
    this.gameOver = false;
    this.steamVents = [];
    this.exitTriggered = false;
    this._idleTimer=0; this._idleFrame=0;
    this._runTimer=0;  this._runFrame=0;
    this._crouchTimer=0; this._crouchFrame=0;
  }

  createGround(platforms) {
    this.platforms = this.physics.add.staticGroup();

    // Single invisible physics ground across full level width
    const groundBody = this.add.rectangle(this.levelWidth/2, H-72, this.levelWidth+200, 80, 0x000000, 0);
    this.physics.add.existing(groundBody, true); // true = static
    this.platforms.add(groundBody);

    // Visual ground strip
const gTex = this.textures.exists('floor_real') ? 'floor_real' : 'ground_plain';

// Chunky repeated platform tiles.
// Use the full useful platform section instead of a thin cropped slice.
const groundFrame = this.textures.get(gTex).getSourceImage();

const cropX = 0;

// floor_real is now pre-cropped from the supplied apartment floor asset.
// Do NOT crop it again, or it turns into a weird thin strip.
const cropY = 0;
const cropW = groundFrame.width;
const cropH = groundFrame.height;

// Wide, taller floor chunks so the tile reads as one continuous deep platform.
const visualTileW = 560;
const visualTileH = 118;

// Put the visible walking surface at the same height as the physics ground.
// Physics ground top is about H-112, so the floor no longer sits below the player.
const groundY = H - 100;

for (let x = visualTileW / 2 - 30; x < this.levelWidth + visualTileW; x += visualTileW - 10) {
  const groundTile = this.add.image(x, groundY, gTex);
  groundTile.setCrop(cropX, cropY, cropW, cropH);
  groundTile.setDisplaySize(visualTileW, visualTileH);
  groundTile.setDepth(8);
}

// Elevated platforms using real texture
    if(platforms) {
      platforms.forEach(p=>{
        for(let i=0;i<p.tiles;i++) {
          const key = this.textures.exists('platform_block') ? 'platform_block' : 'ground';
          const tile = this.physics.add.staticImage(p.x+i*32+16, p.y, key);
          tile.setDepth(9).refreshBody();
          this.platforms.add(tile);
        }
      });
    }
  }

  createPlayer(x,y) {
    this.player = this.physics.add.sprite(x,y,'player');
    this.player.setCollideWorldBounds(false);
    this.player.setBounce(0);
    this.player.body.setGravityY(500);
    this.player.body.setSize(48,82);
    this.player.body.setOffset(9,8);
    this.player.body.setMaxVelocityY(600);
    this.physics.add.collider(this.player,this.platforms);
    this.cameras.main.setBounds(0,0,this.levelWidth,H);
    this.cameras.main.startFollow(this.player,true,0.08,0.08);
    this.cameras.main.setDeadzone(80,H);
    this.physics.world.setBounds(0,0,this.levelWidth+200,H+200);
  }

  createBullets() {
    this.bullets = this.physics.add.group();
    this.enemyBullets = this.physics.add.group();
  }

  createHUD() {
    this.hpIcons = [];
    for(let i=0;i<3;i++) {
      this.hpIcons.push(this.add.image(16+i*20,14,'heart').setScrollFactor(0).setDepth(100));
    }
    this.livesText = this.add.text(W-10,10,`LIVES: ${GameState.lives}`,{fontSize:'14px',fontFamily:'Courier New',color:'#ffffff',stroke:'#000',strokeThickness:2}).setScrollFactor(0).setDepth(100).setOrigin(1,0);
    this.scoreText = this.add.text(W/2,10,`${GameState.score}`,{fontSize:'14px',fontFamily:'Courier New',color:'#ffdd00',stroke:'#000',strokeThickness:2}).setScrollFactor(0).setDepth(100).setOrigin(0.5,0);
    this.powerupText = this.add.text(10,H-20,'',{fontSize:'12px',fontFamily:'Courier New',color:'#ff8800'}).setScrollFactor(0).setDepth(100);

    const lc = this.levelConfig;
    if(lc.title) {
      const lt = this.add.text(W/2,H*0.15,lc.title,{fontSize:'22px',fontFamily:'Impact, Arial Black',color:'#ffaa00',stroke:'#000',strokeThickness:3}).setScrollFactor(0).setDepth(100).setOrigin(0.5).setAlpha(0);
      const lf = this.add.text(W/2,H*0.22,lc.flavor||'',{fontSize:'13px',fontFamily:'Courier New',color:'#aaaaaa',stroke:'#000',strokeThickness:2}).setScrollFactor(0).setDepth(100).setOrigin(0.5).setAlpha(0);
      this.tweens.add({targets:[lt,lf],alpha:1,duration:500,hold:2000,onComplete:()=>{this.tweens.add({targets:[lt,lf],alpha:0,duration:500});}});
    }
    this.updateHPDisplay();
  }

  createMobileControls() {
    const btnAlpha=0.7;
    this.touchBtnGfx = this.add.graphics().setScrollFactor(0).setDepth(101);
    this.btnZones = {
      left:  {x:8,  y:H-85,w:55,h:42},
      right: {x:70, y:H-85,w:55,h:42},
      crouch:{x:36, y:H-40,w:50,h:38},
      jump:  {x:W-75,y:H-85,w:68,h:85},
      shoot: {x:W-148,y:H-85,w:65,h:85},
    };
    this.drawTouchButtons();
    this.add.text(35, H-72,'<',{fontSize:'22px',fontFamily:'Arial Black',color:'#ffffff',stroke:'#000',strokeThickness:2}).setScrollFactor(0).setDepth(102);
    this.add.text(95, H-72,'>',{fontSize:'22px',fontFamily:'Arial Black',color:'#ffffff',stroke:'#000',strokeThickness:2}).setScrollFactor(0).setDepth(102);
    this.add.text(61, H-28,'v',{fontSize:'18px',fontFamily:'Arial Black',color:'#ffdd44',stroke:'#000',strokeThickness:2}).setScrollFactor(0).setDepth(102).setOrigin(0.5);
    this.add.text(61, H-12,'DUCK',{fontSize:'9px',fontFamily:'Courier New',color:'#aaffaa',stroke:'#000',strokeThickness:1}).setScrollFactor(0).setDepth(102).setOrigin(0.5);
    this.add.text(W-41,H-58,'A',{fontSize:'26px',fontFamily:'Arial Black',color:'#44ff44',stroke:'#000',strokeThickness:3}).setScrollFactor(0).setDepth(102).setOrigin(0.5);
    this.add.text(W-41,H-30,'JUMP',{fontSize:'9px',fontFamily:'Courier New',color:'#aaffaa'}).setScrollFactor(0).setDepth(102).setOrigin(0.5);
    this.add.text(W-116,H-58,'B',{fontSize:'26px',fontFamily:'Arial Black',color:'#ff4400',stroke:'#000',strokeThickness:3}).setScrollFactor(0).setDepth(102).setOrigin(0.5);
    this.add.text(W-116,H-30,'FIRE',{fontSize:'9px',fontFamily:'Courier New',color:'#ffaaaa'}).setScrollFactor(0).setDepth(102).setOrigin(0.5);

    this.touchLeft=false; this.touchRight=false; this.touchJump=false; this.touchShoot=false; this.touchCrouch=false;
    this.touchJumpJustPressed=false;
    this._touchIds={};

    const canvas=this.game.canvas;
    const getXY=(touch)=>{
      const r=canvas.getBoundingClientRect();
      return {x:(touch.clientX-r.left)*(W/r.width), y:(touch.clientY-r.top)*(H/r.height)};
    };
    const hitZone=(gx,gy,z)=>gx>=z.x&&gx<=z.x+z.w&&gy>=z.y&&gy<=z.y+z.h;
    const getZone=(gx,gy)=>{ for(const [n,z] of Object.entries(this.btnZones)) if(hitZone(gx,gy,z)) return n; return null; };
    const capName=s=>s.charAt(0).toUpperCase()+s.slice(1);

    const onDown=(e)=>{
      e.preventDefault();
      for(const t of e.changedTouches){
        const {x,y}=getXY(t); const z=getZone(x,y);
        if(z){ this._touchIds[t.identifier]=z; this['touch'+capName(z)]=true; if(z==='jump') this.touchJumpJustPressed=true; }
      }
    };
    const onUp=(e)=>{
      e.preventDefault();
      for(const t of e.changedTouches){ const z=this._touchIds[t.identifier]; if(z){ this['touch'+capName(z)]=false; delete this._touchIds[t.identifier]; } }
    };
    const onMove=(e)=>{
      e.preventDefault();
      for(const t of e.changedTouches){
        const old=this._touchIds[t.identifier]; const {x,y}=getXY(t); const nw=getZone(x,y);
        if(old!==nw){ if(old) this['touch'+capName(old)]=false; if(nw){ this['touch'+capName(nw)]=true; if(nw==='jump') this.touchJumpJustPressed=true; } this._touchIds[t.identifier]=nw||undefined; }
      }
    };
    canvas.addEventListener('touchstart',onDown,{passive:false});
    canvas.addEventListener('touchend',onUp,{passive:false});
    canvas.addEventListener('touchcancel',onUp,{passive:false});
    canvas.addEventListener('touchmove',onMove,{passive:false});
    this.events.once('shutdown',()=>{ canvas.removeEventListener('touchstart',onDown); canvas.removeEventListener('touchend',onUp); canvas.removeEventListener('touchcancel',onUp); canvas.removeEventListener('touchmove',onMove); });
  }

  drawTouchButtons() {
    if(!this.touchBtnGfx) return;
    const g=this.touchBtnGfx; g.clear();
    const draw=(z,col,act)=>{ g.fillStyle(col,act?0.9:0.45); g.fillRoundedRect(z.x,z.y,z.w,z.h,8); g.lineStyle(2,0xffffff,0.5); g.strokeRoundedRect(z.x,z.y,z.w,z.h,8); };
    draw(this.btnZones.left,  0x2244aa,this.touchLeft);
    draw(this.btnZones.right, 0x2244aa,this.touchRight);
    draw(this.btnZones.crouch,0x886600,this.touchCrouch);
    draw(this.btnZones.jump,  0x006622,this.touchJump);
    draw(this.btnZones.shoot, 0x660011,this.touchShoot);
  }

  createKeyboard() {
    this.cursors=this.input.keyboard.createCursorKeys();
    this.keyZ=this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Z);
    this.keyX=this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.X);
    this.keyS=this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S);
  }

  updatePlayer(delta) {
    if(this.levelComplete||this.gameOver) return;
    const p=this.player;
    const left  = this.cursors.left.isDown  || this.touchLeft;
    const right = this.cursors.right.isDown || this.touchRight;
    const jump  = Phaser.Input.Keyboard.JustDown(this.cursors.up)||Phaser.Input.Keyboard.JustDown(this.cursors.space)||this.touchJumpJustPressed;
    const shoot = this.keyZ.isDown||this.keyX.isDown||this.touchShoot;
    const crouch= this.cursors.down.isDown||this.keyS.isDown||this.touchCrouch;
    this.touchJumpJustPressed=false;
    this.onGround=p.body.blocked.down;

    // Crouch
    const wantCrouch=crouch&&this.onGround;
    if(wantCrouch&&!this.isCrouching){ this.isCrouching=true; p.body.setSize(20,22,true); }
    else if(!wantCrouch&&this.isCrouching){ this.isCrouching=false; p.body.setSize(48,82,true); p.body.setOffset(9,8); }

    const PLAYER_IDLE_W=84, PLAYER_IDLE_H=122;
    const PLAYER_RUN_W=84, PLAYER_RUN_H=122;
    const PLAYER_JUMP_W=84, PLAYER_JUMP_H=122;
    const CROUCH_W=90, CROUCH_H=84;
    if(this.isCrouching) {
      p.setVelocityX(0);
      if(left) this.playerFacing=-1;
      if(right) this.playerFacing=1;
      this._crouchTimer+=delta;
      if(this._crouchTimer>500){ this._crouchFrame=this._crouchFrame===0?1:0; this._crouchTimer=0; }
      p.setTexture(this._crouchFrame===0?'player_crouch':'player_crouch_b');
      p.setDisplaySize(CROUCH_W, CROUCH_H);
    } else {
      const speed=180;
      if(left){ p.setVelocityX(-speed); this.playerFacing=-1; }
      else if(right){ p.setVelocityX(speed); this.playerFacing=1; }
      else p.setVelocityX(0);
      if(!this.onGround){
        p.setTexture('player_jump');
        p.setDisplaySize(PLAYER_JUMP_W, PLAYER_JUMP_H);
      } else if(left||right){
        this._runTimer+=delta;
        if(this._runTimer>150){ this._runFrame=this._runFrame===0?1:0; this._runTimer=0; }
        p.setTexture(this._runFrame===0?'player_run_a':'player_run_b');
        p.setDisplaySize(PLAYER_RUN_W, PLAYER_RUN_H);
      } else {
        this._idleTimer+=delta;
        if(this._idleTimer>400){ this._idleFrame=this._idleFrame===0?1:0; this._idleTimer=0; }
        p.setTexture(this._idleFrame===0?'player':'player_idle_b');
        p.setDisplaySize(PLAYER_IDLE_W, PLAYER_IDLE_H);
      }
      if(jump&&this.onGround) p.setVelocityY(-400);
    }
    p.setFlipX(this.playerFacing<0);

    // Shoot (works in all states)
    this.shootCooldown-=delta;
    if(shoot&&this.shootCooldown<=0){ this.fireBullet(); this.shootCooldown=GameState.hasRapidFire?100:250; }

    // Invincibility flash
    if(this.invincible){
      this.invincibleTimer-=delta;
      p.setAlpha(Math.sin(this.invincibleTimer*0.03)>0?1:0.3);
      if(this.invincibleTimer<=0){ this.invincible=false; p.setAlpha(1); }
    }
    if(p.y>H+80) this.playerDied();
    const camLeft=this.cameras.main.scrollX;
    if(p.x<camLeft+20){ p.x=camLeft+20; p.setVelocityX(0); }
    this.drawTouchButtons();
  }

  fireBullet() {
    const p=this.player;
    const bx=p.x+(this.playerFacing*28);
    // Fire at lower body height to hit ground enemies
    const by=this.isCrouching?p.y+8:p.y+12;
    const fire=(vy)=>{
      const b=this.bullets.create(bx,by,'bullet');
      b.setVelocity(620*this.playerFacing,vy);
      b.body.allowGravity=false;
      b.setDepth(15);
      b.setFlipX(this.playerFacing<0);
      this.time.delayedCall(1500,()=>{ if(b&&b.active) b.destroy(); });
    };
    if(GameState.hasSpreadShot){ fire(0); fire(-140); fire(140); }
    else fire(0);
  }

  takeDamage() {
    if(this.invincible||this.levelComplete) return;
    GameState.hp--;
    this.updateHPDisplay();
    if(GameState.hp<=0){ this.playerDied(); return; }
    this.invincible=true; this.invincibleTimer=2000;
    if(this.isCrouching){
      this.player.setTexture('player_crouch_wounded');
      this.time.delayedCall(400,()=>{ if(this.player&&this.player.active) this.player.setTexture('player_crouch'); });
    }
    this.cameras.main.flash(200,255,0,0,0.3);
  }

  playerDied() {
    if(this.gameOver) return;
    GameState.lives--;
    this.gameOver=true;
    this.player.setTexture('player_dead');
    this.time.delayedCall(1500,()=>{
      if(GameState.lives<=0){ GameState.reset(); this.scene.start('StartScreen'); }
      else { GameState.hp=3; this.scene.restart(); }
    });
  }

  killEnemy(enemy) {
    if(!enemy||!enemy.active) return;
    const fx={slime:'fx_slime_death',bat:'fx_bat_death',drone:'fx_drone_death'}[enemy.type]||'fx_explosion';
    const ex=this.add.image(enemy.x,enemy.y,fx).setDepth(20).setScale(0.8);
    this.tweens.add({targets:ex,scaleX:1.8,scaleY:1.8,alpha:0,duration:500,onComplete:()=>ex.destroy()});
    GameState.score+=enemy.points||100;
    this.updateScoreDisplay();
    enemy.destroy();
  }

  explodeBarrel(barrel) {
    if(!barrel||barrel.exploded) return;
    barrel.exploded=true;
    const ex1=this.add.image(barrel.x,barrel.y,'fx_barrel_explode').setDepth(20).setScale(0.8);
    this.tweens.add({targets:ex1,scaleX:1.6,scaleY:1.6,alpha:0,duration:250,onComplete:()=>ex1.destroy()});
    this.time.delayedCall(150,()=>{
      const ex2=this.add.image(barrel.x,barrel.y+10,'fx_barrel_burst').setDepth(19).setScale(0.9);
      this.tweens.add({targets:ex2,scaleX:1.8,scaleY:1.8,alpha:0,duration:400,onComplete:()=>ex2.destroy()});
    });
    if(this.enemies) this.enemies.getChildren().forEach(e=>{ if(!e.active) return; if(Phaser.Math.Distance.Between(barrel.x,barrel.y,e.x,e.y)<80){ e.hp=(e.hp||1)-2; if(e.hp<=0) this.killEnemy(e); } });
    if(!this.invincible&&Phaser.Math.Distance.Between(barrel.x,barrel.y,this.player.x,this.player.y)<70) this.takeDamage();
    GameState.score+=50; this.updateScoreDisplay();
    barrel.destroy();
  }

  checkBulletEnemyCollision() {
    if(!this.enemies) return;
    this.enemies.getChildren().forEach(enemy=>{
      if(!enemy.active) return;
      this.bullets.getChildren().forEach(b=>{
        if(!b.active) return;
        if(Phaser.Math.Distance.Between(b.x,b.y,enemy.x,enemy.y)<(enemy.hitRadius||16)){
          b.destroy();
          enemy.hp=(enemy.hp||1)-1;
          // Hit flash
          const hfx={slime:'fx_slime_hit',bat:'fx_bat_hit',drone:'fx_explosion'}[enemy.type]||'fx_explosion';
          const h=this.add.image(enemy.x,enemy.y-10,hfx).setDepth(25).setScale(0.6);
          this.tweens.add({targets:h,y:h.y-15,alpha:0,duration:250,onComplete:()=>h.destroy()});
          enemy.setTint(0xffffff);
          this.time.delayedCall(100,()=>{ if(enemy.active) enemy.clearTint(); });
          if(enemy.hp<=0) this.killEnemy(enemy);
        }
      });
    });
  }

  checkEnemyPlayerCollision() {
    if(!this.enemies || this.invincible || !this.player || !this.player.active) return;

    const playerBounds = this.player.getBounds();

    this.enemies.getChildren().forEach(e => {
      if(!e.active) return;

      // Bounds collision is more reliable than center-distance for squat enemies like slimes.
      if(Phaser.Geom.Intersects.RectangleToRectangle(playerBounds, e.getBounds())) {
        this.takeDamage();
      }
    });
  }

  checkEnemyBulletPlayerCollision() {
    if(!this.enemyBullets||this.invincible) return;
    this.enemyBullets.getChildren().forEach(b=>{ if(!b.active) return; if(Phaser.Math.Distance.Between(b.x,b.y,this.player.x,this.player.y)<18){ b.destroy(); this.takeDamage(); } });
  }

  collectPickup(player,pickup) {
    const t=pickup.pickupType; pickup.destroy();
    if(t==='pickup_shake'){ GameState.hp=Math.min(3,GameState.hp+1); this.updateHPDisplay(); this.showPopup('HP RESTORED!','#ff88aa'); }
    else if(t==='pickup_mystery'){ Math.random()<0.5?this.activateTimed('hasRapidFire',10000,'RAPID FIRE!','#ff8800'):this.activateTimed('hasSpreadShot',10000,'SPREAD SHOT!','#00aaff'); }
    else if(t==='pickup_coin'){ GameState.score+=200; this.showPopup('+200','#ffdd00'); }
    GameState.score+=25; this.updateScoreDisplay(); this.updatePowerupDisplay();
  }

  activateTimed(flag,duration,label,color) {
    GameState[flag]=true; this.shootCooldown=0;
    this.showPopup(label,color); this.updatePowerupDisplay();
    if(this[flag+'Timer']) this[flag+'Timer'].remove();
    this[flag+'Timer']=this.time.delayedCall(duration,()=>{ GameState[flag]=false; this.showPopup(label.replace('!','')+' EXPIRED','#888888'); this.updatePowerupDisplay(); });
  }

  showPopup(text,color) {
    const pop=this.add.text(this.player.x,this.player.y-40,text,{fontSize:'14px',fontFamily:'Impact, Arial Black',color:color||'#ffffff',stroke:'#000',strokeThickness:3}).setDepth(150).setOrigin(0.5);
    this.tweens.add({targets:pop,y:pop.y-30,alpha:0,duration:1200,onComplete:()=>pop.destroy()});
  }

  completeLevel(nextScene) {
    if(this.levelComplete) return;
    this.levelComplete=true;
    this.player.setVelocityX(0); this.player.setTexture('player_victory');
    this.cameras.main.flash(500,255,255,255,0.5);
    const t=this.add.text(W/2,H/2,'LEVEL COMPLETE!',{fontSize:'36px',fontFamily:'Impact, Arial Black',color:'#ffaa00',stroke:'#000',strokeThickness:4}).setScrollFactor(0).setDepth(200).setOrigin(0.5);
    this.tweens.add({targets:t,scaleX:1.2,scaleY:1.2,yoyo:true,repeat:2,duration:300,onComplete:()=>{ this.time.delayedCall(500,()=>this.scene.start(nextScene)); }});
  }

  updateHPDisplay() { this.hpIcons&&this.hpIcons.forEach((h,i)=>h.setAlpha(i<GameState.hp?1:0.2)); }
  updateScoreDisplay() { this.scoreText&&this.scoreText.setText(`${GameState.score}`); }
  updateLivesDisplay() { this.livesText&&this.livesText.setText(`LIVES: ${GameState.lives}`); }
  updatePowerupDisplay() { let s=''; if(GameState.hasRapidFire) s+='[RAPID] '; if(GameState.hasSpreadShot) s+='[SPREAD]'; this.powerupText&&this.powerupText.setText(s); }

  updateSteamVents(dt) {
    this.steamVents.forEach(v=>{
      v.timer+=dt;
      if(!v.active&&v.timer>v.interval){
        v.active=true; v.timer=0; v.interval=Phaser.Math.Between(2000,4000);
        if(v.img) v.img.setTexture('prop_steam_vent');
        this.time.delayedCall(800,()=>{ v.active=false; if(v.img) v.img.setTexture('steam_off'); });
        this.time.delayedCall(300,()=>{
          if(this.player&&!this.invincible&&Math.abs(this.player.x-v.x)<24&&this.player.y>H-150) this.takeDamage();
        });
      }
    });
  }
}

// ============================================================
// LEVEL 0 - THE APARTMENT
// ============================================================
class Level0Scene extends BaseLevelScene {
  constructor() { super('Level0'); }
  create() {
    this.initLevel({title:'THE APARTMENT',flavor:'"Time to get moving."',width:W*1.5});
    GameState.currentLevel=0;

    // Background - apartment wall drawn across full level
    const bg=this.add.graphics().setDepth(0).setScrollFactor(1);
    bg.fillStyle(0x0d0804); bg.fillRect(0,0,this.levelWidth,H);
    bg.fillStyle(0x221508); bg.fillRect(0,0,this.levelWidth,H*0.75);
    // Baseboard trim
    bg.fillStyle(0x110a04); bg.fillRect(0,H*0.72,this.levelWidth,10);
    // Large windows - 160x110px each, spaced every 220px
    const numWin = Math.ceil(this.levelWidth/220)+1;
    for(let i=0;i<numWin;i++) {
      const wx=i*220+30, wy=30, ww=160, wh=110;
      // Window outer frame
      bg.fillStyle(0x1a1a2a); bg.fillRect(wx,wy,ww,wh);
      // Window glow (dim light outside)
      bg.fillStyle(0x223350); bg.fillRect(wx+4,wy+4,ww-8,wh-8);
      bg.fillStyle(0xffdd88,0.06); bg.fillRect(wx+4,wy+4,ww-8,wh-8);
      // Window panes (4 panes)
      bg.fillStyle(0x0a0a14,0.7);
      bg.fillRect(wx+4,wy+4,(ww-10)/2,(wh-10)/2);
      bg.fillRect(wx+4+ww/2,wy+4,(ww-10)/2,(wh-10)/2);
      bg.fillRect(wx+4,wy+4+wh/2,(ww-10)/2,(wh-10)/2);
      bg.fillRect(wx+4+ww/2,wy+4+wh/2,(ww-10)/2,(wh-10)/2);
      // Frame dividers
      bg.fillStyle(0x2a1a08);
      bg.fillRect(wx+ww/2-1,wy,2,wh); // vertical
      bg.fillRect(wx,wy+wh/2-1,ww,2); // horizontal
    }

    this.createGround(null);

    // Ground Y for props sitting on floor
    const GY = H-90;  // physics ground Y — props/enemies sit at this Y

    // Apartment props - large, sitting right on ground
    this.add.image(260, H-166,'prop_couch').setDepth(8).setScale(1.3);
    this.add.image(510, H-170,'prop_tv').setDepth(8).setScale(1.3);
    this.add.image(780, H-166,'prop_couch').setDepth(8).setScale(1.3).setFlipX(true);
    this.add.image(1000, H-170,'prop_tv').setDepth(8).setScale(1.3);

    // Floor junk
    this.add.image(130, H-132,'soda_can').setDepth(9).setScale(1.3);
    this.add.image(170, H-130,'soda_can').setDepth(9).setScale(1.0).setAngle(35);
    this.add.image(380, H-132,'pizza_box').setDepth(9).setScale(1.5);
    this.add.image(620, H-132,'pizza_box').setDepth(9).setScale(1.3).setAngle(-5);
    this.add.image(870, H-132,'soda_can').setDepth(9).setScale(1.1).setAngle(-20);

    // Doors
    this.add.image(35, H-148,'apt_door').setDepth(4).setScale(0.55);
    this.add.image(this.levelWidth-40, H-148,'apt_door').setDepth(9).setScale(0.55).setFlipX(true);
    this.add.text(this.levelWidth-40, H-220,'EXIT ->',{fontSize:'11px',fontFamily:'Impact, Arial Black',color:'#ffaa00',stroke:'#000',strokeThickness:2}).setDepth(10).setOrigin(0.5);

    this.exitX = this.levelWidth - 70;

    this.createPlayer(80, 270);
    this.player.setDepth(10);
    this.createBullets();
    this.createHUD();
    this.createMobileControls();
    this.createKeyboard();

    // Tutorial slimes - fewer, more spread out
    this.enemies=this.physics.add.group();
    [320, 560, 800].forEach(x=>{
      const s=this.enemies.create(x, 292,'slime_a');
      s.hp=2; s.points=50; s.hitRadius=44; s.type='slime';
      s.idleTimer=0; s.idleFrame=0;
      s.setDisplaySize(88,60);
      s.setDepth(12); // in front of ground props (8) and player (10)... wait, behind player
      s.setVelocityX(-40); s.body.setGravityY(400); s.body.setSize(46,28);
      this.physics.add.collider(s,this.platforms);
    });

    this.physics.add.collider(this.enemies,this.platforms);

    // Tutorial text
    const tt=this.add.text(W/2,H*0.35,'ARROWS: MOVE  |  UP: JUMP  |  DOWN: CROUCH  |  Z: SHOOT',{fontSize:'11px',fontFamily:'Courier New',color:'#88ffaa',stroke:'#000',strokeThickness:2,align:'center'}).setScrollFactor(0).setDepth(100).setOrigin(0.5);
    this.time.delayedCall(5000,()=>this.tweens.add({targets:tt,alpha:0,duration:1000}));
  }

  update(time,delta) {
    this.updatePlayer(delta);
    if(this.enemies) {
      this.enemies.getChildren().forEach(e=>{
        if(!e.active) return;
        if(e.body.blocked.left) e.setVelocityX(40);
        else if(e.body.blocked.right) e.setVelocityX(-40);
        if(e.x<10) e.setVelocityX(40);
        if(!e.idleTimer) e.idleTimer=0;
        e.idleTimer+=delta;
        if(e.idleTimer>600){ e.idleFrame=(e.idleFrame||0)===0?1:0; e.idleTimer=0; }
        e.setTexture(e.idleFrame===0?'slime_a':'slime_b'); e.setDisplaySize(88,60);
      });
    }
    this.checkBulletEnemyCollision();
    this.checkEnemyPlayerCollision();
    this.updateScoreDisplay(); this.updateLivesDisplay(); this.updatePowerupDisplay();
    if(!this.exitTriggered&&this.player&&this.player.x>=this.exitX){ this.exitTriggered=true; this.completeLevel('Level1'); }
  }
}

// ============================================================
// LEVEL 1 - DAD BOD DISTRICT
// ============================================================
class Level1Scene extends BaseLevelScene {
  constructor() { super('Level1'); }
  create() {
    this.initLevel({title:'DAD BOD DISTRICT',flavor:'"Get moving."',width:W*5});
    GameState.currentLevel=1;

    const GY = H-90;  // physics ground Y

    // Solid black base - covers any bleed from other scenes
    this.add.rectangle(this.levelWidth/2, H/2, this.levelWidth, H, 0x000000).setDepth(0).setScrollFactor(1);

    // Far background sky - fill full height so no bottom edge shows
    this.add.tileSprite(W/2, H/2, W, H, 'bg_level1_far').setScrollFactor(0).setDepth(1);

    // Gradient fade at bottom to hide sky/ground seam
    const ov=this.add.graphics().setScrollFactor(0).setDepth(2);
    ov.fillGradientStyle(0x000000,0x000000,0x000000,0x000000,0,0,0.85,0.85);
    ov.fillRect(0,H*0.45,W,H*0.55);

    // City skyline - sits just above ground, parallax slow
    this.add.tileSprite(W/2, GY-60, W, 160, 'bg_level1_skyline').setScrollFactor(0.2).setDepth(3);

    // Ground
    this.createGround([
      {x:300,y:H-160,tiles:4},{x:600,y:H-185,tiles:3},{x:900,y:H-160,tiles:5},
      {x:1300,y:H-185,tiles:4},{x:1700,y:H-165,tiles:6},{x:2100,y:H-185,tiles:4},
      {x:2500,y:H-165,tiles:5},{x:2900,y:H-185,tiles:4},{x:3200,y:H-160,tiles:6},{x:3600,y:H-185,tiles:4},
    ]);

    // Billboards - depth 3, behind skyline layer, scroll with level slightly
    [[700,GY-130,'prop_billboard_noex'],[1800,GY-130,'prop_billboard_gym'],[2900,GY-130,'prop_billboard_noex']].forEach(([x,y,t])=>{
      this.add.image(x,y,t).setDepth(3).setScrollFactor(0.5).setScale(0.75);
    });

    // Ground-level props - sit ON the walkway (depth 9, same as player layer)
    this.add.image(2000, H-130,'prop_treadmill').setDepth(9).setScale(0.55);
    this.add.image(3700, H-140,'prop_fence_gate').setDepth(9).setScale(0.6);

    // Vending machines ON the ground
    [[500,H-125],[1300,H-128],[2100,H-125],[3200,H-125]].forEach(([x,y])=>{
      this.add.image(x,y,'prop_vending_chips').setDepth(9).setScale(0.55);
    });

    // Exit gate
    this.exitX = this.levelWidth - 160;
    this.add.image(this.exitX+80, H-150,'exit_gate').setDepth(9).setScale(0.85);
    const gp=this.add.graphics().setDepth(10);
    gp.fillStyle(0xff8800,0.15); gp.fillRect(this.exitX,H-240,160,150);
    this.tweens.add({targets:gp,alpha:0.3,duration:600,yoyo:true,repeat:-1});

    // Foreground barricades depth 8 - BEHIND player so player runs past them
    [400,900,1500,2200,2800,3400].forEach(x=>this.add.image(x,H-118,'prop_barricade').setDepth(8).setScale(0.8));
    [250,650,1100,1700,2400,3000,3600].forEach(x=>this.add.image(x,H-106,'prop_cone').setDepth(8).setScale(0.7));

    // Steam vents
    [800,1600,2400,3200].forEach(x=>{
      const img=this.add.image(x,H-108,'steam_off').setDepth(7).setScale(0.6);
      const v={x,active:false,timer:0,interval:Phaser.Math.Between(2000,4000),img};
      this.steamVents.push(v);
      this.time.addEvent({delay:v.interval,loop:true,callback:()=>{
        v.img.setTexture('prop_steam_vent');
        this.time.delayedCall(800,()=>{ if(v.img) v.img.setTexture('steam_off'); });
        if(this.player&&!this.invincible&&Math.abs(this.player.x-v.x)<24&&this.player.y>H-150) this.takeDamage();
      }});
    });

    this.createPlayer(60, 309);
    this.player.setDepth(10);
    this.createBullets();

    // Enemies
    this.enemies=this.physics.add.group();
    // Slimes
    [200,500,800,1100,1400,1700,2000,2300,2600,2900,3200,3500].forEach(x=>{
      const s=this.enemies.create(x, 300,'slime_a');
      s.hp=2; s.points=100; s.hitRadius=44; s.type='slime';
      s.idleTimer=0; s.idleFrame=0;
      s.setDisplaySize(88,60); s.setDepth(9);
      s.setVelocityX(Phaser.Math.Between(30,60)*(Math.random()>0.5?1:-1));
      s.body.setGravityY(400); s.body.setSize(46,28);
    });
    // Bats
    [400,700,1000,1400,1800,2200,2600,3000,3400].forEach(x=>{
      const b=this.enemies.create(x,H-220,'bat_a');
      b.hp=1; b.points=150; b.hitRadius=16; b.type='bat';
      b.startY=H-220+Phaser.Math.Between(-20,20); b.swoopTimer=Phaser.Math.Between(1000,3000); b.swooping=false;
      b.setDepth(9);
    });
    // Drones
    [600,1100,1600,2100,2600,3100].forEach(x=>{
      const d=this.enemies.create(x,H-220,'drone_a');
      d.hp=2; d.points=200; d.hitRadius=14; d.type='drone';
      d.hoverY=H-220+Phaser.Math.Between(-20,20); d.shootTimer=Phaser.Math.Between(2000,4000); d.hovDir=Math.random()>0.5?1:-1;
      d.setDepth(9);
    });

    // Barrels
    this.barrels=this.physics.add.group();
    [450,900,1400,1900,2400,2900,3400].forEach(x=>{
      const b=this.physics.add.sprite(x,H-110,'barrel').setScale(0.7);
      b.exploded=false; b.body.setGravityY(0);
      this.physics.add.collider(b,this.platforms);
      this.barrels.add(b);
    });

    // Pickups
    this.pickups=this.physics.add.group();
    [[500,H-210,'pickup_shake'],[1200,H-270,'pickup_coin'],[1800,H-110,'pickup_mystery'],
     [2200,H-230,'pickup_mystery'],[2600,H-230,'pickup_shake'],[3100,H-210,'pickup_coin'],
     [3500,H-110,'pickup_mystery'],[3800,H-230,'pickup_shake']].forEach(([x,y,t])=>{
      const pk=this.pickups.create(x,y,t); pk.pickupType=t; pk.body.setGravityY(200);
    });

    // Colliders — enemies land on ground
    this.physics.add.collider(this.enemies, this.platforms);
    this.physics.add.collider(this.barrels, this.platforms);
    this.physics.add.collider(this.pickups,this.platforms);
    this.physics.add.overlap(this.bullets,this.barrels,(b,barrel)=>{ b.destroy(); this.explodeBarrel(barrel); });
    this.physics.add.overlap(this.player,this.pickups,this.collectPickup,null,this);

    this.createHUD();
    this.createMobileControls();
    this.createKeyboard();
  }

  update(time,delta) {
    this.updatePlayer(delta);

    if(this.enemies) {
      this.enemies.getChildren().forEach(e=>{
        if(!e.active) return;
        if(e.type==='slime'){
          if(e.body.blocked.left) e.setVelocityX(50);
          else if(e.body.blocked.right) e.setVelocityX(-50);
          if(e.x<0) e.setVelocityX(50);
          if(!e.idleTimer) e.idleTimer=0;
          e.idleTimer+=delta;
          if(e.idleTimer>600){ e.idleFrame=(e.idleFrame||0)===0?1:0; e.idleTimer=0; }
          e.setTexture(e.idleFrame===0?'slime_a':'slime_b');
          e.setDisplaySize(88,60).setDepth(9);
        }
        if(e.type==='bat'){
          if(!e.wingTimer) e.wingTimer=0;
          e.wingTimer+=delta;
          if(e.wingTimer>200){ e.wingFrame=(e.wingFrame||0)===0?1:0; e.wingTimer=0; }
          e.setTexture(e.wingFrame===0?'bat_a':'bat_b');
          e.swoopTimer-=delta;
          if(!e.swooping){
            e.y=e.startY+Math.sin(time*0.002+e.x*0.01)*20;
            const dx=this.player.x-e.x; e.setVelocityX(dx>0?60:-60);
            if(e.swoopTimer<=0){ e.swooping=true; e.swoopTimer=Phaser.Math.Between(2000,4000); e.setVelocityY(300); this.time.delayedCall(800,()=>{ if(e.active){ e.swooping=false; e.setVelocityY(0); } }); }
          }
          e.body.setGravityY(e.swooping?0:-500);
        }
        if(e.type==='drone'){
          if(!e.propTimer) e.propTimer=0;
          e.propTimer+=delta;
          if(e.propTimer>150){ e.propFrame=(e.propFrame||0)===0?1:0; e.propTimer=0; }
          e.setTexture(e.propFrame===0?'drone_a':'drone_b');
          e.y=e.hoverY+Math.sin(time*0.003+e.x*0.005)*15;
          e.x+=e.hovDir*0.5;
          if(e.x>this.levelWidth-50||e.x<50) e.hovDir*=-1;
          e.body.setGravityY(-500);
          e.shootTimer-=delta;
          if(e.shootTimer<=0){
            e.shootTimer=Phaser.Math.Between(2000,4000);
            if(Math.abs(e.x-this.player.x)<300){
              const eb=this.enemyBullets.create(e.x,e.y,'enemy_bullet');
              const dx=this.player.x-e.x; const dy=this.player.y-e.y; const len=Math.sqrt(dx*dx+dy*dy);
              eb.setVelocity(dx/len*200,dy/len*200); eb.body.setGravityY(-500);
              this.time.delayedCall(3000,()=>{ if(eb.active) eb.destroy(); });
            }
          }
        }
      });
    }

    this.checkBulletEnemyCollision();
    this.checkEnemyPlayerCollision();
    this.checkEnemyBulletPlayerCollision();
    this.updateScoreDisplay(); this.updateLivesDisplay(); this.updatePowerupDisplay();

    // Bullet cleanup
    [this.bullets,this.enemyBullets].forEach(grp=>{
      grp.getChildren().forEach(b=>{ if(b.x<this.cameras.main.scrollX-50||b.x>this.cameras.main.scrollX+W+50) b.destroy(); });
    });

    if(!this.exitTriggered&&this.player&&this.player.x>=this.exitX){ this.exitTriggered=true; this.completeLevel('Level1Complete'); }
  }
}


// ============================================================
// RECLINER CHARGER HELPER ? shared logic for Level 2+
// ============================================================
// Usage: this.spawnRecliner(x, y)
// Call updateRecliners(time, delta) in scene update
// Recliner states: idle -> warning -> charge -> recover
function spawnRecliner(scene, x, y) {
  const tex = scene.textures.exists('recliner_idle') ? 'recliner_idle' : 'player_fallback';
  const r = scene.enemies.create(x, y, tex);
  r.hp = 99999; // immune to bullets (must jump over)
  r.points = 300;
  r.hitRadius = 40;
  r.type = 'recliner';
  r.state = 'idle'; // idle | warning | charge | recover
  r.stateTimer = Phaser.Math.Between(3000, 6000);
  r.idleFrame = 0; r.idleTimer = 0;
  r.body.setGravityY(400).setSize(70, 60).setImmovable(true);
  return r;
}

function updateRecliner(scene, e, delta) {
  if (!e.active) return;
  e.stateTimer -= delta;

  if (e.state === 'idle') {
    e.setVelocityX(0);
    // Alternate idle frames
    e.idleTimer += 16;
    if (e.idleTimer > 600) { e.idleFrame = e.idleFrame === 0 ? 1 : 0; e.idleTimer = 0; }
    const iTex = e.idleFrame === 0 ? 'recliner_idle' : 'recliner_idle_b';
    if (scene.textures.exists(iTex)) e.setTexture(iTex);
    if (e.stateTimer <= 0 && Math.abs(e.x - scene.player.x) < 500) {
      e.state = 'warning'; e.stateTimer = 800;
    }
  } else if (e.state === 'warning') {
    // Flash warning before charge
    e.setAlpha(Math.sin(Date.now() * 0.02) > 0 ? 1 : 0.5);
    if (e.stateTimer <= 0) {
      e.state = 'charge'; e.stateTimer = 1200; e.setAlpha(1);
      const dir = scene.player.x < e.x ? -1 : 1;
      e.chargeDir = dir;
      e.setVelocityX(dir * 380);
      if (scene.textures.exists('recliner_charge')) e.setTexture('recliner_charge');
      e.setFlipX(dir > 0);
    }
  } else if (e.state === 'charge') {
    // Immune to bullets during charge
    e.hp = 99999;
    if (e.stateTimer <= 0) {
      e.state = 'recover'; e.stateTimer = 1500;
      e.setVelocityX(0);
    }
  } else if (e.state === 'recover') {
    e.setVelocityX(0);
    if (scene.textures.exists('recliner_idle')) e.setTexture('recliner_idle');
    if (e.stateTimer <= 0) {
      e.state = 'idle'; e.stateTimer = Phaser.Math.Between(3000, 6000);
    }
  }
}

class Level1CompleteScene extends Phaser.Scene {

  create() {
    this.add.rectangle(W/2,H/2,W,H,0x0a0010);
    for(let i=0;i<60;i++) this.add.circle(Phaser.Math.Between(0,W),Phaser.Math.Between(0,H),Phaser.Math.Between(1,2),0xffffff,Math.random());
    this.add.text(W/2,H*0.25,'LEVEL 1 COMPLETE',{fontSize:'40px',fontFamily:'Impact, Arial Black',color:'#ffaa00',stroke:'#000',strokeThickness:4}).setOrigin(0.5);
    this.add.text(W/2,H*0.42,`SCORE: ${GameState.score}`,{fontSize:'24px',fontFamily:'Courier New',color:'#44ff44',stroke:'#000',strokeThickness:2}).setOrigin(0.5);
    this.add.text(W/2,H*0.55,'DAD BOD DISTRICT CLEARED.',{fontSize:'16px',fontFamily:'Courier New',color:'#aaaaaa'}).setOrigin(0.5);
    this.add.text(W/2,H*0.68,'LEVEL 2 COMING SOON.',{fontSize:'14px',fontFamily:'Courier New',color:'#666666'}).setOrigin(0.5);
    const r=this.add.text(W/2,H*0.82,'[ TAP TO PLAY AGAIN ]',{fontSize:'18px',fontFamily:'Courier New',color:'#ff4400',stroke:'#000',strokeThickness:2}).setOrigin(0.5);
    this.tweens.add({targets:r,alpha:0.2,duration:600,yoyo:true,repeat:-1});
    this.input.once('pointerdown',()=>{ GameState.reset(); this.scene.start('StartScreen'); });
    this.input.keyboard.once('keydown',()=>{ GameState.reset(); this.scene.start('StartScreen'); });
  }
}
