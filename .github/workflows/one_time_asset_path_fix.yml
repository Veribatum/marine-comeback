name: One-time asset path repair

on:
  push:
    paths:
      - '.github/workflows/one_time_asset_path_fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Correct stale asset references in main.js
        shell: python
        run: |
          from pathlib import Path

          path = Path('main.js')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "assets/vending.png": "assets/Vending.png",
              "assets/city_police.png": "assets/city_Police.png",
              "assets/office_garage_front.png": "assets/office_garage.png",
              "assets/office_platform.png": "assets/city_railing.png",
              "assets/medgust 4.png": "assets/medgust4.png",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}; found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Commit repair and remove one-time workflow
        run: |
          rm .github/workflows/one_time_asset_path_fix.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/one_time_asset_path_fix.yml
          git diff --cached --check
          git commit -m "Fix stale asset references in main.js"
          git push origin HEAD:main
