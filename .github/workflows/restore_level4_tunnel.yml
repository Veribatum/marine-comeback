name: One-time Level 4 tunnel restore

on:
  create:

permissions:
  contents: write

jobs:
  restore:
    if: github.ref == 'refs/heads/trigger-level4-tunnel-restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore office_base tunnel cover
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text()
          old = """// Front tunnel wall sits over the cars as they enter.\nconst officeGarageFront = scene.add.image(\n  500,\n  LEVEL4_STREET_Y - 495,\n  'officeGarage'\n);\n\nofficeGarageFront.setOrigin(0.5, 0);\nofficeGarageFront.setDepth(16);\nofficeGarageFront.setDisplaySize(\n  1050,\n  545\n);"""
          new = """// Front tunnel wall/roof sits over the cars as they enter.\nconst officeBase = scene.add.image(\n  500,\n  LEVEL4_STREET_Y - 495,\n  'officeBase'\n);\n\nofficeBase.setOrigin(0.5, 0);\nofficeBase.setDepth(16);\nofficeBase.setDisplaySize(\n  1050,\n  545\n);"""
          if old not in s:
              raise SystemExit('Expected Level 4 tunnel block not found; refusing to modify')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit source repair and remove this workflow
        run: |
          rm .github/workflows/restore_level4_tunnel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/restore_level4_tunnel.yml
          git commit -m "Restore Level 4 tunnel roof composition"
          git push origin main
