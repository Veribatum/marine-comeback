name: One-time Level 4 texture dedupe
on:
  create:
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/trigger-level4-texture-dedupe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reuse existing texture keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text()
          s = s.replace("this.load.image('officeGarageFront', 'assets/office_garage.png');\n", "")
          s = s.replace("this.load.image('officePlatform', 'assets/city_railing.png');\n", "")
          s = s.replace("'officeGarageFront'", "'officeGarage'")
          s = s.replace("'officePlatform'", "'cityRailing'")
          p.write_text(s)
          PY
      - name: Commit source repair and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dedupe_level4_textures.yml
          git add main.js
          git commit -m "Reuse existing Level 4 textures without duplicate loads"
          git push origin HEAD:main
