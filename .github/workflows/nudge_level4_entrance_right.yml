name: One-time Level 4 entrance nudge right

on:
  create:

permissions:
  contents: write

jobs:
  nudge:
    if: github.ref_type == 'branch' && github.ref_name == 'trigger-level4-entrance-right'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Move Level 4 garage entrance right and bump cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('main.js')
          s = p.read_text()
          old = "const officeGarage = scene.add.image(\n  555,"
          new = "const officeGarage = scene.add.image(\n  755,"
          if old not in s:
              raise SystemExit('Expected officeGarage x=555 block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          if 'main.js?v=9' not in s:
              raise SystemExit('Expected cache version v=9 not found')
          p.write_text(s.replace('main.js?v=9', 'main.js?v=10', 1))
          PY

      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nudge_level4_entrance_right.yml
          git add main.js index.html
          git commit -m "Move Level 4 entrance closer to player"
          git push origin HEAD:main
