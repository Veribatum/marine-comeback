name: One-time Level 4 entrance restore
on:
  create:
jobs:
  restore:
    if: github.ref == 'refs/heads/trigger-level4-entrance-restore'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore visible tunnel entrance
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text()
          old = """const officeGarage = scene.add.image(\n  500,\n  LEVEL4_STREET_Y - 495,\n  'officeGarage'\n);\n\nofficeGarage.setOrigin(0.5, 0);\nofficeGarage.setDepth(3);\nofficeGarage.setDisplaySize(\n  1050,\n  540\n);"""
          new = """const officeGarage = scene.add.image(\n  555,\n  LEVEL4_STREET_Y - 495,\n  'officeGarage'\n);\n\nofficeGarage.setOrigin(0.5, 0);\nofficeGarage.setDepth(17);\nofficeGarage.setDisplaySize(\n  1050,\n  540\n);"""
          if old not in s:
              raise SystemExit('Expected officeGarage block not found; refusing to modify main.js')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit source repair and remove this workflow
        run: |
          rm .github/workflows/restore_level4_entrance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/restore_level4_entrance.yml
          git commit -m "Restore visible Level 4 tunnel entrance"
          git push origin main
